<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ka-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4fe8" />
      <stop offset="50%" stop-color="#c9a7ff" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="ka-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c9a7ff" />
    </linearGradient>
    <filter id="ka-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbit Glass Circle -->
  <circle
    cx="50"
    cy="50"
    r="45"
    stroke="url(#ka-grad-1)"
    stroke-width="3.5"
    fill="rgba(13,2,33,0.85)"
    filter="url(#ka-glow)"
  />
  <circle
    cx="50"
    cy="50"
    r="37"
    stroke="rgba(201,167,255,0.3)"
    stroke-width="1"
    stroke-dasharray="3 3"
  />

  <!-- Stylized K Lettermark & Cosmic Wave -->
  <path
    d="M 35 25 L 35 75 M 35 50 L 65 25 M 35 50 L 65 75"
    stroke="url(#ka-grad-2)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#ka-glow)"
  />

  <!-- Twinkling Star Accents -->
  <circle cx="65" cy="25" r="3" fill="#ffffff" />
  <circle cx="65" cy="75" r="3" fill="#c9a7ff" />
</svg>
